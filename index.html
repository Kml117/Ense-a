<script>
/* Enseña · engine.js — paquete de funciones puras (cripto, notas, tiempo, voz, CSV, ICS).
   Sin dependencias del DOM: corre igual en el navegador y en Node (pruebas). */
(function (G) {
  'use strict';
  const ENS = (G.ENS = {});
  const pad = (n, l = 2) => String(n).padStart(l, '0');

  /* ---------- Reloj (se puede adelantar para probar recordatorios, bloqueos, etc.) ---------- */
  ENS.clock = { offset: 0, now() { return Date.now() + this.offset; } };

  /* ---------- Zona horaria America/Bogota (UTC-5 fijo, sin horario de verano) ---------- */
  const TZ = -5 * 3600000;
  ENS.bog = (ms) => { const d = new Date(ms + TZ); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), wd: d.getUTCDay() }; };
  ENS.fromBog = (y, m, d, h = 0, mi = 0) => Date.UTC(y, m, d, h, mi) - TZ;
  ENS.isoBog = (ms) => { const p = ENS.bog(ms); return `${p.y}-${pad(p.m + 1)}-${pad(p.d)}T${pad(p.h)}:${pad(p.mi)}:00-05:00`; };
  ENS.dateStr = (ms) => { const p = ENS.bog(ms); return `${p.y}-${pad(p.m + 1)}-${pad(p.d)}`; };
  ENS.msFromDateStr = (s, h = 0, mi = 0) => { const [y, m, d] = s.split('-').map(Number); return ENS.fromBog(y, m - 1, d, h, mi); };
  ENS.addDaysStr = (s, n) => ENS.dateStr(ENS.msFromDateStr(s, 12) + n * 86400000);
  ENS.fmt = (ms, o) => new Intl.DateTimeFormat('es-CO', Object.assign({ timeZone: 'America/Bogota' }, o)).format(new Date(ms));
  ENS.fmtTime = (ms) => ENS.fmt(ms, { hour: 'numeric', minute: '2-digit', hour12: true }).replace('a. m.', 'a. m.').replace('p. m.', 'p. m.');
  ENS.fmtDay = (ms) => ENS.fmt(ms, { weekday: 'long', day: 'numeric', month: 'long' });
  ENS.fmtShort = (ms) => ENS.fmt(ms, { day: 'numeric', month: 'short' });
  ENS.hhmmToMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

  /* ---------- SHA-256 síncrono (cadenas de hash de historial y auditoría) ---------- */
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  ENS.sha256 = function (msg) {
    const bytes = new TextEncoder().encode(msg), l = bytes.length, nb = ((l + 9 + 63) >> 6) << 6;
    const buf = new Uint8Array(nb); buf.set(bytes); buf[l] = 0x80;
    const dv = new DataView(buf.buffer); dv.setUint32(nb - 4, (l * 8) >>> 0); dv.setUint32(nb - 8, Math.floor((l * 8) / 4294967296));
    let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const w = new Uint32Array(64);
    for (let o = 0; o < nb; o += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
      for (let i = 16; i < 64; i++) {
        const a = w[i - 15], b = w[i - 2];
        const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
        const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      h = [h[0] + a, h[1] + b, h[2] + c, h[3] + d, h[4] + e, h[5] + f, h[6] + g, h[7] + hh].map((x) => x >>> 0);
    }
    return h.map((x) => x.toString(16).padStart(8, '0')).join('');
  };

  /* ---------- TOTP real (RFC 6238, HMAC-SHA1 vía WebCrypto) ---------- */
  const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  ENS.b32decode = (s) => { let bits = '', out = []; for (const ch of s.replace(/=+$/, '').toUpperCase()) bits += B32.indexOf(ch).toString(2).padStart(5, '0'); for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2)); return new Uint8Array(out); };
  ENS.randomB32 = (n = 16, rnd) => { let s = ''; for (let i = 0; i < n; i++) s += B32[Math.floor((rnd ? rnd() : Math.random()) * 32)]; return s; };
  ENS.totp = async function (secret, ms, step = 30) {
    const counter = Math.floor(ms / 1000 / step), msg = new Uint8Array(8), dv = new DataView(msg.buffer);
    dv.setUint32(0, Math.floor(counter / 4294967296)); dv.setUint32(4, counter >>> 0);
    const key = await crypto.subtle.importKey('raw', ENS.b32decode(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg)), off = mac[19] & 15;
    const bin = ((mac[off] & 0x7f) << 24) | (mac[off + 1] << 16) | (mac[off + 2] << 8) | mac[off + 3];
    return pad(bin % 1000000, 6);

    return `<h1>Configuración${sup ? ' · ' + esc(Rr.get('institutions', instId).nombre) : ''}</h1>${sup ? `<select id="c-i" data-chg="cfgInst">${opts([...['DEMO01', 'DEMO02'].map((c) => D.instByCode(c)).map((i) => [i.id, i.nombre])], instId)}</select>` : ''}<p class="muted">El colegio se adapta con datos (JSON validado y versionado), no con código. Los cambios de escala o de periodos aplican solo a periodos nuevos.</p><label for="c-j">Editar (se guarda como borrador)</label><textarea id="c-j" rows="14" class="mono">${esc(JSON.stringify(cur, null, 2))}</textarea><button class="btn primary" data-act="cfgSave">Validar y guardar borrador</button><div id="c-err"></div><h2>Versiones</h2>${vs.map((v) => `<div class="li"><b>v${v.version}</b> ${chip(v.estado, v.estado === 'publicada' ? 'ok' : '')}<span class="muted small">${ENS.fmtShort(v.created_at)}</span>${v.estado === 'borrador' ? `<button class="btn sm primary" data-act="cfgPub" data-id="${v.id}">Publicar</button>` : v.estado === 'archivada' ? `<button class="btn sm" data-act="cfgRoll" data-id="${v.id}">Volver a esta versión</button>` : ''}</div>`).join('')}`;
  };
  A.cfgInst = () => { S.cfgInst = val('c-i'); UI.render(); };
  A.cfgSave = guard(() => { const r = D.saveDraft(S.cfgR, S.user, val('c-j')); if (r.errors) { $('#c-err').innerHTML = `<div class="note err"><b>Corrige esto antes de guardar:</b><ul>${r.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>`; return; } toast('Borrador v' + r.version.version + ' guardado.'); UI.render(); });
  A.cfgPub = guard((d) => { D.publishConfig(S.cfgR, S.user, d.id); toast('Configuración publicada.'); UI.render(); });
  A.cfgRoll = guard((d) => { D.rollbackConfig(S.cfgR, S.user, d.id); toast('Se restauró esa versión como nueva.'); UI.render(); });
  V.usuarios = () => { const Rr = R(), us = Rr.list('users', (u) => u.role !== 'ACUDIENTE'); return `<h1>Usuarios</h1>${tbl(['Nombre', 'Rol', 'ID', 'Estado'], us.map((u) => `<tr><td>${esc(u.nombre)}</td><td>${esc(u.role.toLowerCase().replace('_', ' '))}</td><td>${esc(u.teacher_code)}</td><td>${u.must_change ? chip('pendiente primer ingreso', 'warn') : chip('activo', 'ok')}</td></tr>`))}<h2>Importar por CSV</h2><p class="muted small">Columnas: rol, id, nombre, correo (opcional teléfono). Roles: PROFESOR, COORDINADOR, SECRETARIA, DIRECTIVO.</p><textarea id="u-csv" rows="5" placeholder="rol,id,nombre,correo\nPROFESOR,PRO100,Nuevo Docente,nuevo@colegio.co"></textarea><button class="btn" data-act="usPrev">Vista previa</button><div id="u-out"></div>`; };
  A.usPrev = guard(() => { const pv = D.previewImportUsers(R(), S.user, val('u-csv')); S.upv = pv; $('#u-out').innerHTML = `<p><b>${pv.ok.length}</b> válidos · <b>${pv.bad.length}</b> con errores</p>${pv.bad.map((b) => `<div class="small err-t">Fila ${b.fila}: ${esc(b.error)}</div>`).join('')}${pv.ok.map((u) => `<div class="li small">${esc(u.nombre)} · ${u.rol} · ${esc(u.id)}</div>`).join('')}${pv.ok.length ? '<button class="btn primary" data-act="usApply">Crear usuarios y enviar invitaciones</button>' : ''}`; });
  A.usApply = guard(() => { const n = D.applyImportUsers(R(), S.user, S.upv); toast(`${n} usuario(s) creados. Invitaciones en la bandeja de correo simulada.`); UI.render(); });
  V.auditoria = () => { const Rr = R(), l = Rr.list('audit_log').slice(-40).reverse(), v = D.verifyChain(Rr, 'audit_log'); return `<h1>Auditoría</h1><p>${v.ok ? chip('Cadena de hashes íntegra', 'ok') : chip('Cadena alterada', 'ausente')} <span class="muted small">${v.count} registros</span></p><button class="btn" data-act="integrity">Verificar notas y auditoría</button>${tbl(['Cuándo', 'Quién', 'Acción', 'Detalle'], l.map((a) => `<tr><td>${ENS.fmtShort(a.fecha)} ${ENS.fmtTime(a.fecha)}</td><td>${esc(Rr.get('users', a.user_id)?.nombre || '—')}</td><td>${esc(a.action)}</td><td class="small">${esc(a.detail || '')}</td></tr>`))}`; };
  V.colegios = () => { const ins = ['DEMO01', 'DEMO02'].map((c) => D.instByCode(c)), sg = (D.db.support || []).filter((g) => g.until > now()); return `<h1>Colegios</h1><p class="muted">Sin acceso temporal de soporte no ves datos académicos de ningún colegio.</p>${ins.map((i) => `<div class="card"><b>${esc(i.nombre)}</b> · ${esc(i.code)} · ${esc(i.plan)}<div class="row wrap"><button class="btn sm" data-act="cfgGo" data-id="${i.id}">Configuración</button><button class="btn sm" data-act="supForm" data-id="${i.id}">Pedir acceso temporal de soporte</button></div></div>`).join('')}${sg.length ? `<h2>Accesos activos</h2>${sg.map((g, k) => `<div class="li"><span>${esc(D.instByCode(g.code).nombre)} · hasta ${ENS.fmtTime(g.until)}</span><button class="btn sm" data-act="supOpen" data-k="${k}">Ver panel (solo lectura)</button></div>`).join('')}` : ''}`; };
  A.cfgGo = (d) => { S.cfgInst = d.id; go('config'); };
  A.supForm = (d) => UI.modal('Acceso temporal de soporte', `<p>El acceso dura 60 minutos, es de solo lectura (panel) y queda auditado en el colegio.</p><label for="s-m">Motivo</label><textarea id="s-m" rows="3"></textarea><button class="btn primary" data-act="supGo" data-id="${d.id}">Solicitar</button>`);
  A.supGo = guard((d) => { if (val('s-m').trim().length < 8) throw new Error('Escribe el motivo (mínimo 8 caracteres).'); const i = [...D.db.t.institutions.values()].find((x) => x.id === d.id), Rr = D.repo({ institution_id: i.id, user_id: S.user.id }); (D.db.support = D.db.support || []).push({ inst: i.id, code: i.code, until: now() + 3600000, motivo: val('s-m') }); D.audit(Rr, 'soporte.solicitud', 'institutions', i.id, val('s-m')); UI.closeModal(); toast('Acceso temporal concedido por 60 minutos.'); UI.render(); });
  A.supOpen = guard((d) => { const g = D.db.support.filter((x) => x.until > now())[+d.k], Rr = D.repo({ institution_id: g.inst, user_id: S.user.id }), p = D.panel(Rr, { id: S.user.id, role: 'ADMIN_COLEGIO' }); D.audit(Rr, 'soporte.consulta', 'panel', null, 'solo lectura'); UI.modal('Panel (solo lectura)', `<p>Asistencia: ${p.sesiones} clases, ${p.ausentes} ausencias · Notas pendientes: ${p.notasPendientes}/${p.notasTotal} · Mensajes hoy: ${p.mensajesHoy}</p><p class="muted small">Esta consulta quedó en la auditoría del colegio.</p>`); });

  /* ================= Pruebas, docs, ajustes ================= */
  V.pruebas = () => `<h1>Pruebas de aceptación</h1><p class="muted">Se ejecutan sobre una copia con datos nuevos; no tocan lo que ves en la app. Cubren aislamiento, MFA, asistencia, notas, auditoría, convivencia, voz y fase 2.</p><button class="btn primary" data-act="runTests">Ejecutar las pruebas</button><div id="t-out"></div>`;
  A.runTests = guard(async () => { const out = $('#t-out'); out.innerHTML = '<p>Ejecutando…</p>'; const rows = []; const res = await D.runTests((r, n) => { rows.push(r); out.innerHTML = `<p>${n} pruebas ejecutadas…</p>`; }); const okN = res.filter((r) => r.ok).length; out.innerHTML = `<div class="note ${okN === res.length ? 'ok' : 'err'}"><b>${okN} de ${res.length} pruebas pasan</b></div>${res.map((r) => `<div class="test ${r.ok ? 'ok' : 'bad'}"><b>${r.ok ? '✓' : '✗'} ${esc(r.id)}</b> ${esc(r.name)} <span class="muted small">${r.ms} ms</span>${r.detail ? `<div class="small muted">${esc(r.detail)}</div>` : ''}</div>`).join('')}`; });
  const DEC = [['Es un prototipo de navegador', 'Todo corre en esta página: la “base de datos” es memoria y se reinicia al recargar. Las reglas (RLS, cadenas de hash, MFA, cola de mensajes) están emuladas para validar la lógica; en producción van en PostgreSQL, servidor y Redis.'], ['IA simulada', 'AIProvider tiene un proveedor por reglas (clasificación, convivencia, voz, correos). Respeta el contrato del documento (JSON validado, un reintento, ai_logs, seudónimos, defensa contra inyección). Para producción se reemplaza por ClaudeProvider en el servidor.'], ['Contradicción del documento (paso 1 del ingreso)', 'El texto pide mostrar nombre y logo en el paso 1 y a la vez no revelar qué códigos existen. Elegí lo más seguro: el nombre aparece tras validar credenciales. Alternativa: mostrarlo en el paso 1 con límite de intentos por IP.'], ['Contraseñas', 'Se usa SHA-256 iterado como sustituto de Argon2id, que no corre en un navegador sin librerías. Solo para el prototipo.'], ['TOTP real', 'El código de verificación es TOTP estándar (RFC 6238); en la demo se muestra en pantalla porque no hay app autenticadora.'], ['Periodo cerrado con notas faltantes', 'Al cerrar, la definitiva se calcula con las notas existentes y se marca “incompleta”; se advierte antes de cerrar. Es una decisión mía; el documento no la define.'], ['Mensajes de ausencia', 'Máximo 1 mensaje por estudiante por día. Si falla el proveedor se reintenta con espera exponencial. Fuera del horario 6:00–20:00 (configurable) el mensaje espera.'], ['Orientador escolar', 'No está en la lista de roles; el aviso urgente llega a coordinación y a directivos y se registra el nombre de “Orientación escolar” de la configuración.'], ['Grupos de 25', 'El documento pide 150 estudiantes en 6 grupos (25 por grupo); la prueba de asistencia usa 25, no 30.'], ['Datos de ejemplo', 'Los periodos se siembran relativos a la fecha de hoy: Periodo 1 cerrado, Periodo 2 abierto y Periodo 3 planeado, para poder probar “cerrar” y “abrir nuevo periodo”.']];
  const PEND = ['Servidor real: PostgreSQL con RLS, Redis/BullMQ, Argon2id, cifrado de campos con gestor de llaves.', 'WhatsApp Cloud API, correo (SPF/DKIM/DMARC) y SMS reales: aquí los envíos son simulados.', 'Claude como proveedor de IA y evals en CI; búsqueda vectorial del manual de convivencia.', 'PWA instalable con modo sin conexión real (service worker, IndexedDB, Web Push); aquí el modo sin conexión es una simulación.', 'Excel .xlsx real y PDF generado en servidor (aquí: CSV e impresión del navegador).', 'Límite de peticiones por IP, copias de seguridad, escaneo de archivos, SAST/Dependabot, prueba de penetración (SEC-10 a SEC-14).', 'Fase 3: talleres con IA, extracción de SIEE y manual, Google/Microsoft SSO, sincronización de calendarios, portal de estudiantes.', 'Revisión legal (Ley 1581, Ley 1620 y normas de evaluación) antes de comercializar.'];
  const SEC = [['SEC-01', 'MFA, bloqueo, sesiones cortas', 'Implementado (hash simulado)'], ['SEC-02', 'Autorización por rol/curso y RLS; prueba IDOR', 'Implementado y probado'], ['SEC-03', 'Rol de la app sin UPDATE/DELETE en historial', 'Implementado y probado'], ['SEC-04', 'Historial de notas con hash encadenado + verificador', 'Implementado y probado'], ['SEC-05', 'Periodo cerrado rechaza cambios (app + trigger)', 'Implementado y probado'], ['SEC-06', 'Motivo obligatorio; aprobador ≠ solicitante', 'Implementado y probado'], ['SEC-07', 'audit_log de ingresos, configuración, casos, exportaciones', 'Implementado'], ['SEC-08/09', 'TLS, cifrado en reposo, secretos', 'Pendiente en producción (cifrado de campo simulado)'], ['SEC-10', 'Copias de seguridad', 'Pendiente en producción'], ['SEC-11/12', 'OWASP, cabeceras, límites', 'Parcial: escape de salida y validación; resto en servidor'], ['SEC-13/14', 'Archivos, dependencias, pentest', 'Pendiente en producción'], ['SEC-15', 'Alertas de comportamiento anómalo', 'Implementado y probado (masivo, nocturno, cadena)'], ['SEC-16', 'Plan de incidentes (SECURITY.md)', 'Pendiente'], ['SEC-17/18', 'Ley 1581, retención y exportación', 'Parcial: exportación CSV; política pendiente'], ['SEC-19', 'Proveedor de IA sin entrenamiento', 'Pendiente (contrato)']];
  V.docs = () => `<h1>Documentos y decisiones</h1><div class="note"><b>Alcance de este prototipo (fases 0, 1 y 2 en versión básica).</b> Sirve para ver y probar los flujos con datos ficticios, no para usarse con estudiantes reales.</div><h2>DECISIONS.md</h2>${DEC.map((d) => `<div class="card"><b>${esc(d[0])}</b><p>${esc(d[1])}</p></div>`).join('')}<h2>Pendientes</h2><ul>${PEND.map((p) => `<li>${esc(p)}</li>`).join('')}</ul><h2>Matriz de seguridad</h2>${tbl(['Código', 'Requisito', 'Estado'], SEC.map((s) => `<tr><td><b>${s[0]}</b></td><td>${esc(s[1])}</td><td>${esc(s[2])}</td></tr>`))}<h2>Cómo desplegarlo</h2><p>Es un solo archivo estático: súbelo como <code>index.html</code> a un repositorio de GitHub e impórtalo en Vercel (Framework: “Other”, sin comando de build). No requiere variables de entorno.</p>`;
  V.ajustes = () => { const u = S.user, Rr = R(), sec = u.mfa_secret_enc ? D.decField(u.mfa_secret_enc) : null, off = u.pref_offsets || [20]; return `<h1>Mi perfil y ajustes</h1><div class="card"><b>${esc(u.nombre)}</b><div class="muted">${esc(u.role.toLowerCase().replace('_', ' '))} · ${esc(u.teacher_code || u.email)}</div></div><div class="card"><h3>Apariencia</h3><label class="check"><input type="checkbox" id="s-dark" ${S.theme === 'dark' ? 'checked' : ''} data-chg="theme"> Modo oscuro</label></div>${['PROFESOR', 'COORDINADOR', 'DIRECTIVO'].includes(u.role) ? `<div class="card"><h3>Aviso por defecto de tus eventos</h3><select id="s-off" data-chg="prefOff">${opts([['5', '5 minutos antes'], ['10', '10 minutos antes'], ['20', '20 minutos antes'], ['30', '30 minutos antes'], ['60', '1 hora antes'], ['1440', '1 día antes']], String(off[0]))}</select></div>` : ''}<div class="card"><h3>Notificaciones del navegador</h3><button class="btn" data-act="pushAsk">Permitir avisos del navegador</button></div>${sec ? `<div class="card"><h3>Verificación en dos pasos</h3><p class="muted small">Clave de tu aplicación autenticadora (demo): <code class="sel">${esc(sec)}</code></p><button class="btn" data-act="revokeDev">Olvidar dispositivos recordados</button></div>` : ''}<div class="card"><h3>Herramientas de demostración</h3><p class="muted small">Para probar recordatorios, bloqueos, horarios de envío y el modo sin conexión.</p><div class="row wrap"><button class="btn sm" data-act="clock" data-m="60">Adelantar 1 hora</button><button class="btn sm" data-act="clock" data-m="1440">Adelantar 1 día</button><button class="btn sm" data-act="clock" data-m="0">Reloj real</button><button class="btn sm" data-act="clock" data-m="am">Hoy 10:00 a. m.</button><button class="btn sm" data-act="offline">${S.offline ? 'Volver a conectar' : 'Simular sin conexión'}</button><button class="btn sm" data-act="reseed">Reiniciar datos de ejemplo</button></div><p class="muted small">Hora del sistema: ${ENS.fmtDay(now())} ${ENS.fmtTime(now())}</p></div>`; };
  A.theme = () => { S.theme = $('#s-dark').checked ? 'dark' : 'light'; try { localStorage.setItem('ens_theme', S.theme); } catch (_) { /* nada */ } UI.render(); };
  A.prefOff = guard(() => { R().update('users', S.user.id, { pref_offsets: [+val('s-off')] }); toast('Listo. Los nuevos eventos usarán ese aviso.'); });
  A.pushAsk = () => { try { Notification.requestPermission().then((p) => toast(p === 'granted' ? 'Avisos del navegador activados.' : 'No se activaron los avisos.', p === 'granted' ? 'ok' : 'warn')); } catch (_) { toast('Tu navegador no admite avisos.', 'warn'); } };
  A.revokeDev = guard(() => { R().list('trusted_devices', (d) => d.user_id === S.user.id).forEach((d) => R().update('trusted_devices', d.id, { expires: 0 })); try { Object.keys(localStorage).filter((k) => k.startsWith('ens_dev_')).forEach((k) => localStorage.removeItem(k)); } catch (_) { /* nada */ } S.devTokens = {}; toast('Dispositivos olvidados: se pedirá verificación en el próximo ingreso.'); });
  A.clock = (d) => { if (d.m === '0') ENS.clock.offset = 0; else if (d.m === 'am') { let ds = ENS.dateStr(Date.now()); ENS.clock.offset = ENS.msFromDateStr(ds, 10, 0) - Date.now(); } else ENS.clock.offset += +d.m * 60000; UI.render(); };
  A.offline = () => { S.offline = !S.offline; if (!S.offline) A.flush(); UI.render(); };
  A.reseed = () => { D.db = D.newDb(); D.seed(); S.token = null; S.user = null; UI.render(); toast('Datos de ejemplo reiniciados.'); };

  /* ================= Portal de acudientes ================= */
  V.portalHome = () => { const h = D.guardianHome(R(), S.user), ps = D.periods(R()).filter((p) => p.status !== 'planeado'); return `<h1>Hola, ${esc(first(S.user.nombre))}</h1><p class="muted">Aquí ves a tus hijos: notas, asistencia y mensajes del colegio.</p>${h.map((c) => `<div class="card"><h2>${esc(c.student.nombre)} <span class="muted small">Grupo ${esc(c.grupo)}</span></h2><div class="row wrap">${chip('Ausencias (30 días): ' + c.ausencias, c.ausencias ? 'ausente' : 'ok')}${chip('Tardes: ' + c.tardes, 'tarde')}${chip('Excusadas: ' + c.excusadas, 'excusado')}</div>${tbl(['Materia', 'Parcial', 'Acumulado'], c.notas.map((n) => `<tr><td>${esc(n.materia)}</td><td>${n.parcial ?? '—'}</td><td>${n.acumulado ?? '—'}</td></tr>`))}<div class="row wrap">${ps.map((p) => `<button class="btn sm" data-act="bolG" data-s="${c.student.id}" data-p="${p.id}">Boletín ${esc(p.nombre)}</button>`).join('')}</div></div>`).join('')}`; };
  V.portalNotas = V.portalHome;
  A.bolG = guard((d) => { const b = D.boletin(R(), S.user, d.s, d.p); S.bolHtml = boletinHtml(b); UI.modal('Boletín', S.bolHtml + '<button class="btn primary" data-act="blPrint">Imprimir / guardar PDF</button>', true); });
  V.portalMensajes = () => { const l = D.messagesFor(R(), S.user), h = D.guardianHome(R(), S.user); return `<h1>Mensajes</h1><div class="card"><h3>Responder al colegio</h3><select id="p-s">${opts(h.map((c) => [c.student.id, c.student.nombre]))}</select><textarea id="p-t" rows="3" placeholder="Escribe tu respuesta…"></textarea><button class="btn primary" data-act="pReply">Enviar</button></div>${l.length ? l.map((x) => `<div class="msg ${x.direccion}"><div class="row wrap">${chip(x.direccion === 'saliente' ? 'Del colegio' : 'Tu respuesta')}<span class="muted small">${esc(x.estudiante)} · ${ENS.fmtShort(x.fecha)}</span></div><p>${esc(x.cuerpo)}</p></div>`).join('') : empty('No tienes mensajes')}`; };
  A.pReply = guard(() => { D.receiveReply(R(), S.user, S.user.guardian_id, val('p-s'), val('p-t')); toast('Respuesta enviada. Coordinación la revisará.'); UI.render(); });
})(window);

;

document.addEventListener('DOMContentLoaded',function(){window.UI.boot();});
</script>
</body>
